[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smithchart_tool"
version = "0.1.0"
description = "Python library for Smith Chart analysis"
authors = [
    {name = "Alan Rodriguez Bojorjes"}
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "matplotlib"
]

[tool.setuptools]
packages = ["smithchart_tool"]